name: Update from upstream and Publish Firefox Extension

on:
  # 定时触发（每天检查一次）
  schedule:
    - cron: '0 0 * * *'
  # 手动触发
  workflow_dispatch:
  # 如果可以配置webhook，也可以在upstream仓库更新时触发

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment: production  # 指定使用名为production的环境及其secrets
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true  # 确保凭证在后续步骤中可用

      # 设置Git配置
      - name: Configure Git
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          # 添加upstream远程仓库
          git remote add upstream https://github.com/siyuan-note/siyuan-chrome.git || true
          git fetch upstream

      # 保存当前版本号
      - name: Save current version
        id: current_version
        run: |
          # 从manifest.json提取版本号
          VERSION=$(grep -o '"version": "[^"]*"' manifest.json | cut -d '"' -f 4)
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          echo "当前版本: $VERSION"

      # 拉取并合并upstream代码
      - name: Pull and merge from upstream
        run: |
          # 切换到main分支
          git checkout main
          # 设置默认合并策略
          git config pull.rebase false
          # 拉取upstream代码
          git pull upstream main -X theirs --no-edit

      # 转换Chrome API为Firefox API
      - name: Convert Chrome API to Firefox API
        run: |
          # 执行类似我们脚本中的API转换逻辑
          find . -type f -name "*.js" -not -path "*/node_modules/*" -not -path "*/\.*" | while read file; do
            echo "处理文件: $file"
            # 替换chrome API为browser API
            sed -i 's/chrome\./browser\./g' "$file"
          done

      # Firefox MV3 不支持 importScripts，将 importScripts 声明迁移至 manifest.json
      - name: Migrate importScripts to manifest.json
        run: |
          python3 -c "
          import json, re, sys

          # 读取 background.js，提取 importScripts 调用中的脚本路径
          with open('background.js', 'r') as f:
              bg_content = f.read()

          match = re.search(r'importScripts\(([^)]+)\)', bg_content)
          if not match:
              print('background.js 中未找到 importScripts，跳过')
              sys.exit(0)

          # 解析脚本路径列表
          raw = match.group(1)
          scripts = [s.strip().strip('\"').strip(\"'\") for s in raw.split(',')]
          scripts = [s for s in scripts if s]

          if not scripts:
              print('importScripts 中未找到有效脚本路径，跳过')
              sys.exit(0)

          print('发现 importScripts 调用，迁移以下脚本到 manifest.json:')
          for s in scripts:
              print(f'  {s}')

          # 删除 background.js 中的 importScripts 行
          new_bg = re.sub(r'^importScripts\([^)]+\);\s*\n?', '', bg_content, count=1, flags=re.MULTILINE)
          with open('background.js', 'w') as f:
              f.write(new_bg)

          # 修改 manifest.json，在 background.scripts 中 background.js 之前插入脚本
          with open('manifest.json', 'r') as f:
              manifest = json.load(f)

          bg_scripts = manifest.get('background', {}).get('scripts', [])
          if 'background.js' in bg_scripts:
              idx = bg_scripts.index('background.js')
              for script in reversed(scripts):
                  if script not in bg_scripts:
                      bg_scripts.insert(idx, script)
              manifest['background']['scripts'] = bg_scripts
          else:
              for script in scripts:
                  if script not in bg_scripts:
                      bg_scripts.insert(0, script)
              manifest['background']['scripts'] = bg_scripts

          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write('\n')

          print('迁移完成，manifest.json background.scripts 已更新')
          print('当前 background.scripts:', manifest['background']['scripts'])
          "

      # 检查版本号是否变化
      - name: Check for version change
        id: version_check
        run: |
          # 从更新后的manifest.json提取版本号
          NEW_VERSION=$(grep -o '"version": "[^"]*"' manifest.json | cut -d '"' -f 4)
          echo "新的版本: $NEW_VERSION"
          
          # 比较版本号
          if [ "${{ steps.current_version.outputs.current_version }}" != "$NEW_VERSION" ]; then
            echo "版本已更新！"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "版本未变化。"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      # 提交并推送更改
      - name: Commit and push changes
        run: |
          # 检查当前工作目录状态（调试信息）
          echo "当前工作目录内容："
          ls -la
          
          # 显示git状态（调试信息）
          echo "Git状态："
          git status
          
          # 检查是否有未推送的提交
          if git log origin/main..HEAD --oneline; then
            echo "发现有未推送的提交，尝试直接推送..."
            # 直接推送已存在的提交
            git push origin main -f
            echo "已成功推送所有未推送的提交。"
          else
            # 检查是否有未提交的更改
            if [ -n "$(git status --porcelain)" ]; then
              echo "发现未提交的更改，准备提交..."
              # 添加所有更改
              git add .
              # 强制添加manifest.json（确保版本更新被捕获）
              git add manifest.json
              # 提交更改
              git commit -m "自动提交：从upstream拉取代码并转换chrome API为browser API"
              echo "准备推送更改..."
              git push origin main -f
              echo "更改已成功推送到仓库。"
            else
              echo "没有未提交的更改，工作树干净。"
              # 尝试直接推送（即使显示没有更改，也可能是因为更改已经被提交但未推送）
              echo "尝试直接推送，确保所有更改都已推送到远程..."
              git push origin main -f
            fi
          fi
          
          # 显示最终状态（调试信息）
          echo "最终Git状态："
          git status
      
      # 安装Firefox扩展打包工具
      - name: Install web-ext
        if: steps.version_check.outputs.version_changed == 'true'
        run: |
          npm install --global web-ext

      # 打包并发布Firefox扩展（遇到版本冲突时自动递增小版本重试）
      - name: Build and Publish Firefox extension
        if: steps.version_check.outputs.version_changed == 'true'
        run: |
          MAX_RETRY=10
          ATTEMPT=0

          # 读取基础版本号（X.Y.Z 格式）
          BASE_VERSION=$(python3 -c "
          import json
          with open('manifest.json') as f:
              print(json.load(f)['version'])
          ")

          echo "基础版本号: $BASE_VERSION"

          while [ $ATTEMPT -lt $MAX_RETRY ]; do
            if [ $ATTEMPT -eq 0 ]; then
              CURRENT_VERSION="$BASE_VERSION"
            else
              CURRENT_VERSION="${BASE_VERSION}.${ATTEMPT}"
              # 更新 manifest.json 中的版本号
              python3 -c "
          import json
          with open('manifest.json', 'r') as f:
              manifest = json.load(f)
          manifest['version'] = '$CURRENT_VERSION'
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write('\n')
          "
              echo "版本冲突，递增版本号至: $CURRENT_VERSION"
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "第 $ATTEMPT 次尝试，版本: $CURRENT_VERSION"

            # 清理之前的构建产物
            rm -rf web-ext-artifacts

            # 打包
            web-ext build --no-input
            echo "打包完成"

            # 发布
            set +e
            SIGN_OUTPUT=$(web-ext sign \
              --api-key ${{ secrets.MOZILLA_API_KEY }} \
              --api-secret ${{ secrets.MOZILLA_API_SECRET }} \
              --channel listed 2>&1)
            SIGN_EXIT=$?
            set -e

            if [ $SIGN_EXIT -eq 0 ]; then
              echo "发布成功！版本: $CURRENT_VERSION"
              break
            fi

            # 检查是否为版本冲突错误
            if echo "$SIGN_OUTPUT" | grep -q "uploaded before and deleted\|Version.*was uploaded before"; then
              echo "版本 $CURRENT_VERSION 已发布过，将递增版本号重试..."
              if [ $ATTEMPT -ge $MAX_RETRY ]; then
                echo "已达到最大重试次数 ($MAX_RETRY)，发布失败"
                exit 1
              fi
              continue
            fi

            # 非版本冲突错误，直接失败
            echo "$SIGN_OUTPUT"
            echo "发布失败（非版本冲突），退出"
            exit $SIGN_EXIT
          done
        env:
          NODE_ENV: production